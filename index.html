<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0ece1" />
    <meta
      name="description"
      content="Chaveamento, repescagem e estatísticas do Campeonato FIFA do acampamento Unidos Acamp."
    />
    <title>Campeonato FIFA · Unidos Acamp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Aplica o tema antes da primeira pintura. Sem isto a página aparece clara
      por um instante e só depois vira preta, piscando a cada carregamento.
    -->
    <script>
      ;(function () {
        try {
          var salvo = localStorage.getItem('unidos-acamp-tema')
          var tema =
            salvo === 'claro' || salvo === 'escuro'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'escuro'
                : 'claro'
          document.documentElement.dataset.tema = tema
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', tema === 'escuro' ? '#14131c' : '#f0ece1')
        } catch (erro) {
          document.documentElement.dataset.tema = 'claro'
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
